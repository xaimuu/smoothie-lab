<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Smoothie Lab</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🥤</text></svg>">
<style>
html,body{margin:0;padding:0}
body{background:#f6f8f6;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;padding:20px 14px 40px}
@media(max-width:530px){body{padding:10px 6px 30px}}
</style>
</head>
<body>
<div id="smoothie-lab-calculator"></div>
<style>
#smoothie-lab-calculator{font-family:inherit;color:#27312d;max-width:800px;margin:0 auto;line-height:1.45}#smoothie-lab-calculator *{box-sizing:border-box}#smoothie-lab-calculator .sl-wrap{border:1px solid #e0e6e0;border-radius:17px;padding:20px;background:#fff}#smoothie-lab-calculator h2{font-size:1.55rem;margin:0 0 3px}#smoothie-lab-calculator h3{font-size:1.08rem;margin:0 0 12px}#smoothie-lab-calculator .sub{color:#65736c;margin:0 0 16px;font-size:.85rem}#smoothie-lab-calculator .dash{background:#f1f6f1;border-radius:13px;padding:18px;text-align:center;margin-bottom:18px}#smoothie-lab-calculator .eyebrow{font-size:.75rem;font-weight:700;letter-spacing:.045em;color:#51695a}#smoothie-lab-calculator .big{font-weight:800;font-size:2.8rem;line-height:1.2;margin:5px 0 10px}#smoothie-lab-calculator .macros{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}#smoothie-lab-calculator .macro{background:#fff;border-radius:8px;padding:9px 4px}#smoothie-lab-calculator .macro small{display:block;color:#65736c}#smoothie-lab-calculator .macro strong{font-size:.95rem}#smoothie-lab-calculator .section{padding:16px 0;border-top:1px solid #e8ece8}#smoothie-lab-calculator .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}#smoothie-lab-calculator label{font-size:.85rem;font-weight:600;display:block;margin-bottom:5px}#smoothie-lab-calculator input:not([type=checkbox]),#smoothie-lab-calculator select{display:block;width:100%;min-width:0;border:1px solid #bdcbbf;border-radius:8px;padding:10px 9px;background:#fff;color:#27312d;font:inherit;font-size:.88rem;min-height:43px}#smoothie-lab-calculator .field{margin-top:9px}#smoothie-lab-calculator .hidden{display:none!important}#smoothie-lab-calculator .checkgrid{display:grid;grid-template-columns:1fr 1fr;gap:11px}#smoothie-lab-calculator .checkgrid label{font-weight:400;display:flex;align-items:center;gap:8px;margin:0}#smoothie-lab-calculator input[type=checkbox]{width:17px;height:17px;accent-color:#587c61}#smoothie-lab-calculator .note{font-size:.78rem;color:#63736a;margin:10px 0 0}#smoothie-lab-calculator .summary-line{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-bottom:1px solid #eff2ef;font-size:.89rem}#smoothie-lab-calculator .summary-line span:last-child{white-space:nowrap}#smoothie-lab-calculator .sum-total{display:flex;justify-content:space-between;font-weight:700;font-size:1.1rem;padding:12px 0}#smoothie-lab-calculator .sum-macro{display:flex;justify-content:space-between;font-size:.87rem;padding:3px 0}#smoothie-lab-calculator .buttons{display:flex;gap:10px;margin:16px 0}#smoothie-lab-calculator button{cursor:pointer;border:0;border-radius:9px;padding:12px 16px;font:inherit;font-weight:700}#smoothie-lab-calculator .copy{flex:1;background:#416b4b;color:#fff}#smoothie-lab-calculator .clear{background:#e9eee9;color:#27312d}#smoothie-lab-calculator .status{font-size:.8rem;color:#416b4b;min-height:1em}#smoothie-lab-calculator .warn{color:#936b20}@media(max-width:530px){#smoothie-lab-calculator .sl-wrap{padding:13px}#smoothie-lab-calculator .macros{grid-template-columns:repeat(3,minmax(0,1fr))}#smoothie-lab-calculator .big{font-size:2.4rem}#smoothie-lab-calculator .cols{gap:7px}#smoothie-lab-calculator input:not([type=checkbox]),#smoothie-lab-calculator select{font-size:13px;padding:9px 5px}}
</style>
<script>
(function(){
const root=document.getElementById('smoothie-lab-calculator');if(!root||root.dataset.ready)return;root.dataset.ready='1';
const cups=[['.25','¼ cup'],[String(1/3),'⅓ cup'],['.5','½ cup'],[String(2/3),'⅔ cup'],['.75','¾ cup'],['1','1 cup'],['1.5','1½ cups'],['2','2 cups']];
// Nutrient order: protein, fiber, total carbohydrates, fat, sugar.
const liquids={premier:['Premier Protein shake',160,[30,3,5,3,1]],fairlife:['Fairlife chocolate milk',140,[13,0,13,4.5,12]],almond:['Unsweetened almond milk',30,[1,0,1,2.5,0]],whole:['Whole milk',150,[8,0,12,8,12]],two:['2% milk',120,[8,0,12,5,12]],skim:['Skim milk',80,[8,0,12,0,12]],oat:['Oat milk (original)',120,[3,2,16,5,7]],water:['Water',0,[0,0,0,0,0]]};
const powders=[['½ scoop Optimum Nutrition Gold Standard Whey',60,[12,0,1.5,.5,.5]],['1 scoop Optimum Nutrition Gold Standard Whey',120,[24,0,3,1,1]]];
const bananas=[['½ frozen 6-inch banana',45,[.55,1.3,11.5,.15,6]],['1 frozen 6-inch banana',90,[1.1,2.6,23,.3,12]],['2 frozen 6-inch bananas',180,[2.2,5.2,46,.6,24]]];
const avocados=[['⅓ cup diced avocado',50,[.6,2.1,2.7,4.6,.2]],['⅔ cup diced avocado',100,[1.2,4.2,5.4,9.2,.4]]];
const tofus=[['85 g silken tofu',45,[4,.2,1.5,2.5,.4]],['170 g silken tofu',90,[8,.4,3,5,.8]]];
const peanuts=[['1 tbsp regular peanut butter',95,[3.5,1,3.5,8,1.5]],['2 tbsp regular peanut butter',190,[7,2,7,16,3]],['2 tbsp PB2 powdered peanut butter',60,[6,1.5,5,1.5,2]],['4 tbsp PB2 powdered peanut butter',120,[12,3,10,3,4]]];
const fruits={cherries:['Cherries',93,[1.5,3.2,24,.3,19]],raspberries:['Raspberries',64,[1.5,8,15,.8,5.4]],strawberries:['Strawberries',50,[1,3,12,.5,7.5]],blueberries:['Blueberries',84,[1.1,3.6,21.5,.5,15]],blackberries:['Blackberries',62,[2,7.6,14,.7,7]],assorted:['Assorted berries',70,[1.3,5,16,.5,10]],pineapple:['Pineapple',80,[.9,2.3,21,.2,16]],mango:['Mango',99,[1.4,2.6,25,.6,23]],peaches:['Peaches',60,[1.4,2.3,15,.4,13]]};
const apples=[['½ small apple',35,[.15,1.65,9.5,.1,7]],['1 small apple',70,[.3,3.3,19,.2,14]],['1 medium apple',95,[.5,4.4,25,.3,19]],['1 large apple',115,[.6,5.4,31,.4,23]],['2 small apples',140,[.6,6.6,38,.4,28]]];
const premierFlavors=['Mocha','Caramel Macchiato','Cookies & Cream','Chocolate','Vanilla','Café Latte','Strawberries & Cream'];const powderFlavors=['Double Rich Chocolate','Extreme Milk Chocolate','Vanilla Ice Cream'];const yogurtFlavors=['Cherry','Boston Cream Pie','Caramel Apple Pie','Strawberry Cheesecake','Toasted Marshmallow','Raspberry Chocolate','Strawberry','Vanilla','Blueberry','Peach','Banana Cream','Toasted Coconut Vanilla','Tiramisu'];const extras=['Spinach','Handful of ice cubes','Vanilla','Instant Coffee or Espresso','Matcha','Cinnamon'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const opts=(arr)=>arr.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');const plain=(arr)=>opts(arr.map(x=>[x,x]));const servings=arr=>opts([['','None'],...arr.map((v,i)=>[String(i),`${v[0]} · ${v[1]} cal`])]);const field=(id,label,inner)=>`<div><label for="sl-${id}">${label}</label>${inner}</div>`;const sel=(id,options)=>`<select id="sl-${id}">${options}</select>`;const inp=(id,placeholder,type='text')=>`<input id="sl-${id}" type="${type}" ${type==='number'?'min="0" step="any"':''} placeholder="${esc(placeholder)}">`;const special=(label,id)=>`<div class="field hidden" id="sl-${id}-wrap">${field(id,label,inp(id,'Enter '+label.toLowerCase()))}</div>`;
root.innerHTML=`<div class="sl-wrap"><h2>The Smoothie Lab</h2><p class="sub">Build your smoothie and track estimated nutrition.</p><div class="dash"><div class="eyebrow">TOTAL ESTIMATED CALORIES</div><div class="big"><span id="sl-calories">0</span> cal</div><div class="macros">${['Protein','Fiber','Carbs','Fat','Sugar'].map((m,i)=>`<div class="macro"><small>${m}</small><strong id="sl-macro-${i}">0.0 g</strong></div>`).join('')}</div><div id="sl-partial-top" class="note hidden">Macro totals are partial because manual ingredients have unknown nutrients.</div></div>
<div class="section"><h3>1. Liquid</h3><div class="cols">${field('liquid','Liquid',sel('liquid',opts([['','None'],...Object.entries(liquids).map(([k,v])=>[k,v[0]]),['other','Other (manual entry)']])))}<div id="sl-liquid-qty-holder">${field('liquid-qty','Quantity',sel('liquid-qty',opts([['','Select quantity']])) )}</div><div class="hidden" id="sl-liquid-cal-holder">${field('liquid-cal','Calories',inp('liquid-cal','Calories','number'))}</div></div><div id="sl-liquid-flavor-holder" class="field hidden">${field('liquid-flavor','Premier Protein flavor',sel('liquid-flavor',opts([['','Select flavor'],...premierFlavors.map(x=>[x,x]),['Other','Other']])))}${special('Flavor','liquid-other-flavor')}</div><div id="sl-liquid-other-holder" class="field hidden">${field('liquid-name','Liquid name and quantity',inp('liquid-name','Ingredient and quantity'))}</div></div>
<div class="section"><h3>2. Protein Powder</h3><div class="cols"><div>${field('powder','Protein powder',sel('powder',opts([['','None'],...powders.map((x,i)=>[String(i),`${x[0]} · ${x[1]} cal`]),['other','Other (manual)']])) )}</div><div id="sl-powder-cal-holder" class="hidden">${field('powder-cal','Calories',inp('powder-cal','Calories','number'))}</div></div><div id="sl-powder-manual-holder" class="field hidden">${field('powder-name','Product name and quantity',inp('powder-name','Product and quantity'))}</div><div id="sl-powder-flavor-holder" class="field hidden">${field('powder-flavor','Protein powder flavor',sel('powder-flavor',opts([['','Select flavor'],...powderFlavors.map(x=>[x,x]),['Other','Other']])))}${special('Flavor','powder-other-flavor')}</div></div>
<div class="section"><h3>3. Greek Yogurt</h3>${field('yogurt','Greek yogurt',sel('yogurt',opts([['','None'],['dannon','Dannon Light + Fit Greek Yogurt · 80 cal'],['chobani','Chobani Plain Nonfat Greek Yogurt'],['other','Other (manual entry)']])))}<div class="field hidden" id="sl-yogurt-flavor-holder">${field('yogurt-flavor','Flavor',sel('yogurt-flavor',opts([['','Select flavor'],...yogurtFlavors.map(x=>[x,x]),['Other','Other']])))}${special('Flavor','yogurt-other-flavor')}</div><div class="field hidden" id="sl-yogurt-qty-holder">${field('yogurt-qty','Quantity',sel('yogurt-qty',opts([['','Select quantity'],...cups.map(([v,t])=>[v,`${t} · ${Math.round(90*Number(v)/.75)} cal`])])) )}</div><div class="field hidden" id="sl-yogurt-manual-holder"><div class="cols">${field('yogurt-name','Yogurt name and quantity',inp('yogurt-name','Product and quantity'))}${field('yogurt-cal','Calories',inp('yogurt-cal','Calories','number'))}</div></div></div>
<div class="section"><h3>4. Banana</h3>${sel('banana',servings(bananas))}</div><div class="section"><h3>5. Avocado</h3>${sel('avocado',servings(avocados))}</div><div class="section"><h3>6. Silken Tofu</h3>${sel('tofu',servings(tofus))}</div>
<div class="section"><h3>7. Fruit</h3>${[1,2,3].map(i=>`<div class="field"><label>Fruit ${i}</label><div class="cols">${sel('fruit-'+i,opts([['','None'],...Object.entries(fruits).map(([k,v])=>[k,v[0]]),['apple','Apple']]))}${sel('fruit-qty-'+i,opts([['','Quantity']]))}</div></div>`).join('')}</div>
<div class="section"><h3>8. Peanut Butter / PB2</h3>${sel('peanut',servings(peanuts))}</div><div class="section"><h3>9. Optional Additions</h3><div class="checkgrid">${extras.map((x,i)=>`<label><input type="checkbox" id="sl-extra-${i}"> ${esc(x)} (~0 cal)</label>`).join('')}</div><p class="note"><strong>Nutrition note:</strong> Small amounts of optional additions are treated as nutritionally negligible for simplicity. Larger amounts may contribute additional calories and nutrients.</p><p class="note"><strong>Caffeine note:</strong> Matcha, coffee, espresso, and some protein shakes contain caffeine. Follow product serving guidelines and be mindful of your total caffeine intake.</p></div>
<div class="section"><h3>10. Custom Ingredients</h3>${[1,2].map(i=>`<div class="field"><label>Custom Ingredient ${i}</label><div class="cols">${inp('custom-name-'+i,'Ingredient and quantity')}${inp('custom-cal-'+i,'Calories','number')}</div></div>`).join('')}<p class="note">Custom ingredients count toward calories only; other nutrients are unknown.</p></div>
<div class="section"><h3>11. Your Smoothie</h3><div id="sl-ingredients"><p class="note">No ingredients selected.</p></div><div class="sum-total"><span>Total estimated calories</span><span id="sl-summary-cal">0 cal</span></div><div id="sl-summary-macros"></div><p id="sl-partial-summary" class="note hidden">Macro totals are incomplete because manually entered ingredients have unknown nutritional values.</p><div class="buttons"><button type="button" class="copy" id="sl-copy">Copy My Smoothie</button><button type="button" class="clear" id="sl-clear">Clear All</button></div><div class="status" id="sl-copy-status" aria-live="polite"></div><p class="note">Nutrition values are estimates and may vary by brand, flavor, serving size, and preparation. Manually entered ingredients are counted for calories only.</p></div></div>`;
const get=id=>root.querySelector('#sl-'+id);const val=id=>get(id)?.value||'';const show=(id,yes)=>get(id)?.classList.toggle('hidden',!yes);const format=n=>n.toFixed(1);const valid=s=>s.trim()!==''&&Number.isFinite(Number(s))&&Number(s)>=0;let lastCopy='';
function updateFruit(i){const f=val('fruit-'+i);const q=get('fruit-qty-'+i);const previous=q.value;let list=[['','Quantity']];if(f==='apple')list.push(...apples.map((a,j)=>[String(j),`${a[0]} · ${a[1]} cal`]));else if(fruits[f])list.push(...cups.map(([v,t])=>[v,`${t} · ${Math.round(fruits[f][1]*Number(v))} cal`]));q.innerHTML=opts(list);if(list.some(x=>x[0]===previous))q.value=previous;q.disabled=!f;}
function updateLiquid(){const l=val('liquid');show('liquid-qty-holder',l!=='other');show('liquid-cal-holder',l==='other');show('liquid-other-holder',l==='other');show('liquid-flavor-holder',l==='premier');show('liquid-other-flavor-wrap',l==='premier'&&val('liquid-flavor')==='Other');const q=get('liquid-qty');const old=q.value;let list=[['','Select quantity']];if(liquids[l]){list.push(...cups.map(([v,t])=>[v,`${t} · ${Math.round(liquids[l][1]*Number(v)*(l==='premier'?8/11:1))} cal`]));if(l==='premier')list.push(['halfshake','½ shake (5.5 oz) · 80 cal'],['fullshake','Full shake (11 oz) · 160 cal']);}q.innerHTML=opts(list);if(list.some(x=>x[0]===old))q.value=old;q.disabled=!liquids[l];}
function updateVisibility(){updateLiquid();const p=val('powder'),y=val('yogurt');show('powder-cal-holder',p==='other');show('powder-manual-holder',p==='other');show('powder-flavor-holder',p!==''&&p!=='other');show('powder-other-flavor-wrap',p!==''&&p!=='other'&&val('powder-flavor')==='Other');show('yogurt-flavor-holder',y==='dannon');show('yogurt-other-flavor-wrap',y==='dannon'&&val('yogurt-flavor')==='Other');show('yogurt-qty-holder',y==='chobani');show('yogurt-manual-holder',y==='other');}
function calculate(){updateVisibility();const items=[];const add=(name,cal,n,manual=false)=>items.push({name,cal,n,manual});const manual=(nameId,calId)=>{if(val(nameId).trim()&&valid(val(calId)))add(val(nameId).trim(),Number(val(calId)),[0,0,0,0,0],true);};const simple=(arr,id)=>{const v=val(id);if(v!==''&&arr[Number(v)]){const x=arr[Number(v)];add(...x);}};const l=val('liquid'),lq=val('liquid-qty');if(liquids[l]&&lq){const x=liquids[l],isShake=l==='premier'&&(lq==='halfshake'||lq==='fullshake');const s=isShake?(lq==='halfshake'?.5:1):Number(lq)*(l==='premier'?8/11:1);const qty=isShake?(lq==='halfshake'?'½ shake (5.5 oz)':'Full shake (11 oz)'):(cups.find(q=>q[0]===lq)||[])[1];const flavor=val('liquid-flavor')==='Other'?val('liquid-other-flavor').trim():val('liquid-flavor');if(qty)add(`${qty} ${x[0]}${l==='premier'&&flavor?' ('+flavor+')':''}`,x[1]*s,x[2].map(n=>n*s));}if(l==='other')manual('liquid-name','liquid-cal');const p=val('powder');if(p==='other')manual('powder-name','powder-cal');else if(p!==''&&powders[Number(p)]){const x=powders[Number(p)],fl=val('powder-flavor')==='Other'?val('powder-other-flavor').trim():val('powder-flavor');add(x[0]+(fl?' ('+fl+')':''),x[1],x[2]);}
const y=val('yogurt');if(y==='dannon'){const fl=val('yogurt-flavor')==='Other'?val('yogurt-other-flavor').trim():val('yogurt-flavor');add('1 Dannon Light + Fit Greek yogurt'+(fl?' ('+fl+')':''),80,[12,0,9,0,7]);}else if(y==='chobani'&&val('yogurt-qty')){const qty=cups.find(q=>q[0]===val('yogurt-qty'));if(qty){const s=Number(qty[0])/.75;add(`${qty[1]} Chobani Plain Nonfat Greek Yogurt`,90*s,[16,0,6,0,6].map(n=>n*s));}}else if(y==='other')manual('yogurt-name','yogurt-cal');simple(bananas,'banana');simple(avocados,'avocado');simple(tofus,'tofu');for(let i=1;i<=3;i++){const f=val('fruit-'+i),q=val('fruit-qty-'+i);if(f==='apple'&&q!==''&&apples[Number(q)])add(...apples[Number(q)]);else if(fruits[f]&&q){const x=fruits[f],cup=cups.find(a=>a[0]===q);if(cup){const s=Number(q);add(`${cup[1]} ${x[0].toLowerCase()}`,x[1]*s,x[2].map(n=>n*s));}}}simple(peanuts,'peanut');extras.forEach((e,i)=>{if(get('extra-'+i).checked)add(e,0,[0,0,0,0,0]);});for(let i=1;i<=2;i++)manual('custom-name-'+i,'custom-cal-'+i);const calories=items.reduce((s,x)=>s+x.cal,0);const macros=[0,1,2,3,4].map(i=>items.reduce((s,x)=>s+x.n[i],0));const partial=items.some(x=>x.manual);get('calories').textContent=Math.round(calories);get('summary-cal').textContent=Math.round(calories)+' cal';macros.forEach((m,i)=>get('macro-'+i).textContent=format(m)+' g');show('partial-top',partial);show('partial-summary',partial);get('ingredients').innerHTML=items.length?items.map(x=>`<div class="summary-line"><span>${esc(x.name)}${x.manual?' <small class="warn">(calories only)</small>':''}</span><span>${x.cal===0?'~0':Math.round(x.cal)} cal</span></div>`).join(''):'<p class="note">No ingredients selected.</p>';get('summary-macros').innerHTML=['Protein','Fiber','Carbohydrates','Fat','Sugar'].map((n,i)=>`<div class="sum-macro"><span>${n}${partial?' (partial)':''}</span><span>${format(macros[i])} g</span></div>`).join('');lastCopy='Breakfast Smoothie\n\n'+(items.length?items.map(x=>`• ${x.name} – ${x.cal===0?'~0':Math.round(x.cal)} cal`).join('\n'):'No ingredients selected')+'\n\nTotal: ~'+Math.round(calories)+' cal\n'+['Protein','Fiber','Carbs','Fat','Sugar'].map((n,i)=>`${n}: ~${format(macros[i])} g${partial?' (partial)':''}`).join('\n')+(partial?'\n\nMacros are incomplete. Manual ingredients count toward calories only.':'');}
root.addEventListener('input',e=>{if(e.target.matches('input,select')){if(e.target.id==='sl-liquid'){get('liquid-qty').value='';get('liquid-flavor').value='';}if(e.target.id==='sl-powder')get('powder-flavor').value='';if(e.target.id==='sl-yogurt'){get('yogurt-qty').value='';get('yogurt-flavor').value='';}if(/^sl-fruit-[123]$/.test(e.target.id)){updateFruit(e.target.id.slice(-1));}calculate();}});
root.addEventListener('change',e=>{if(e.target.matches('input,select'))calculate();});get('clear').addEventListener('click',()=>{root.querySelectorAll('input').forEach(x=>{if(x.type==='checkbox')x.checked=false;else x.value='';});root.querySelectorAll('select').forEach(x=>x.value='');for(let i=1;i<=3;i++)updateFruit(i);get('copy-status').textContent='';calculate();});get('copy').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(lastCopy);else{const t=document.createElement('textarea');t.value=lastCopy;t.style.position='fixed';t.style.opacity='0';root.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Copy not available');}get('copy-status').textContent='Copied! Ready to paste into your food log.';}catch(e){get('copy-status').textContent='Clipboard access is blocked by this browser or site.';}});
for(let i=1;i<=3;i++)updateFruit(i);calculate();
})();
</script>
</body>
</html>
