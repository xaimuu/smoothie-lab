html,body{margin:0;padding:0}
body{background-color:#fff3ef;background-image:radial-gradient(#ffd6de 1.2px,transparent 1.2px);background-size:22px 22px;font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:22px 14px 40px;color:#2e1f36}
#smoothie-lab-calculator{color:#2e1f36;max-width:760px;margin:0 auto;line-height:1.5;font-size:16px}

#smoothie-lab-calculator .section>summary{list-style:none;display:flex;align-items:center;gap:12px;cursor:pointer;padding:13px 16px;min-height:49px;color:var(--accent)}

#smoothie-lab-calculator .section>summary h3{margin:0;flex:1}

#smoothie-lab-calculator .section[open]>summary:after{transform:rotate(225deg);margin-top:6px}
#smoothie-lab-calculator .section>summary:focus-visible{outline:3px solid var(--accent);outline-offset:-4px;border-radius:18px}
#smoothie-lab-calculator .section-body{padding:0 16px 16px}
#smoothie-lab-calculator .section-tools{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:14px 0 6px}

#smoothie-lab-calculator .section-tools button:focus-visible{outline:3px solid #6b7bff;outline-offset:2px}
#smoothie-lab-calculator .section-tools .inspo{position:relative;display:flex;min-width:0}
#smoothie-lab-calculator .section-tools .inspo>button{flex:1;white-space:nowrap;padding:6px;color:#a52857;border:2px solid transparent;background:linear-gradient(#fff,#fff) padding-box,linear-gradient(90deg,#ff9bb3,#ffb48e,#ffd58a) border-box}
#smoothie-lab-calculator .section-tools .inspo>button[aria-expanded="true"]{background:linear-gradient(#fff0f4,#fff0f4) padding-box,linear-gradient(90deg,#ff9bb3,#ffb48e,#ffd58a) border-box}

#smoothie-lab-calculator .section-tools .tool-pair button{white-space:nowrap;padding-left:6px;padding-right:6px}
#smoothie-lab-calculator .inspo-menu{position:absolute;top:calc(100% + 6px);left:0;z-index:15;width:max-content;min-width:100%;max-width:min(320px,calc(100vw - 32px));max-height:60vh;overflow-y:auto;background:#fff;border:1px solid #f5cada;border-radius:16px;box-shadow:0 12px 28px rgba(165,40,87,.18);padding:6px}

#smoothie-lab-calculator .section-tools .inspo-menu button:hover,#smoothie-lab-calculator .section-tools .inspo-menu button:focus-visible{background:#fff0f4;outline:none}
#smoothie-lab-calculator .section-tools .inspo-menu .inspo-clear{color:#a52857}
#smoothie-lab-calculator .inspo-menu hr{border:0;border-top:1px solid #f5cada;margin:4px 6px}

#smoothie-lab-calculator .field{margin-top:10px}

#smoothie-lab-calculator .status{font-size:.85rem;font-weight:700;color:var(--accent);min-height:1.2em}
#smoothie-lab-calculator .warn{color:#b86200}
#smoothie-lab-calculator .mini-dash{position:fixed;top:6px;left:50%;width:calc(100% - 20px);max-width:740px;z-index:20;display:flex;align-items:center;gap:10px;padding:7px 10px 7px 14px;border-radius:16px;background:linear-gradient(135deg,#ff4f79 0%,#ff7a45 50%,#ffb627 100%);color:#fff;box-shadow:0 6px 18px rgba(255,79,121,.35);cursor:pointer;transform:translate(-50%,-140%);opacity:0;pointer-events:none;transition:transform .22s ease,opacity .22s ease}

#smoothie-lab-calculator .mini-cal{font-family:"Fredoka","Nunito",sans-serif;font-weight:700;font-size:1.35rem;line-height:1;white-space:nowrap;text-shadow:0 1px 0 rgba(0,0,0,.08)}
#smoothie-lab-calculator .mini-cal small{font-size:.8rem;font-weight:600}

#smoothie-lab-calculator .mini-macro small{display:block;font-size:.6rem;font-weight:800}

#smoothie-lab-calculator .mini-macro:nth-child(1) small{color:#d6335f}
#smoothie-lab-calculator .mini-macro:nth-child(2) small{color:#3a8a2c}
#smoothie-lab-calculator .mini-macro:nth-child(3) small{color:#b86200}
#smoothie-lab-calculator .mini-macro:nth-child(4) small{color:#4458c9}
#smoothie-lab-calculator .mini-macro:nth-child(5) small{color:#8c44bb}
@media(max-width:380px){#smoothie-lab-calculator .mini-dash{gap:7px;padding:7px 8px 7px 11px}#smoothie-lab-calculator .mini-cal{font-size:1.15rem}#smoothie-lab-calculator .mini-macros{gap:3px}#smoothie-lab-calculator .mini-macro strong{font-size:.68rem}#smoothie-lab-calculator .mini-macro small{font-size:.56rem}}

@media(hover:none) and (pointer:coarse){#smoothie-lab-calculator input:not([type=checkbox]),#smoothie-lab-calculator select,#smoothie-lab-calculator textarea{font-size:16px}}
@media(prefers-reduced-motion:reduce){#smoothie-lab-calculator button,#smoothie-lab-calculator .mini-dash{transition:none}}
</style>

if(id==='sl-banana-type')get('banana-qty').value='';if(id==='sl-greens')get('greens-qty').value='';if(id==='sl-pb2')get('pb2-qty').value='';if(id==='sl-peanut')get('peanut-qty').value='';if(id==='sl-nutella')get('nutella-qty').value='';if(id==='sl-walnut')get('walnut-qty').value='';if(id==='sl-top-date')get('top-date-qty').value='';if(id==='sl-top-chocolate')get('top-chocolate-qty').value='';if(id==='sl-top-granola')get('top-granola-qty').value='';if(id==='sl-top-bar')get('top-bar-qty').value='';for(let i=1;i<=2;i++){if(id==='sl-top-other-'+i&&val('top-other-'+i)!=='other'){get('top-other-cal-'+i).value='';get('top-other-name-'+i).value='';}}if(id==='sl-sweetener')get('sweetener-qty').value='';if(id==='sl-kick-1')get('kick-qty-1').value='';if(id==='sl-kick-2')get('kick-qty-2').value='';if(id==='sl-milk')get('milk-qty').value='';if(id==='sl-shake'){get('shake-qty').value='';get('shake-flavor').value='';}if(id==='sl-powder'){get('powder-qty').value='';get('powder-flavor').value='';}if(id==='sl-coconut')get('coconut-qty').value='';if(id==='sl-cottage'){get('cottage-qty').value='';get('cottage-other-name').value='';get('cottage-other-cal').value='';}if(id==='sl-kefir')get('kefir-qty').value='';if(id==='sl-cultured-other'&&val('cultured-other')!=='other'){get('cultured-other-name').value='';get('cultured-other-cal').value='';}if(id==='sl-yogurt'){get('yogurt-qty').value='';get('yogurt-flavor').value='';get('yoplait-flavor').value='';}if(id==='sl-avocado-type'){get('avocado-qty').value='';}if(id==='sl-tofu')get('tofu-grams').value='';if(id==='sl-oat-type')get('oat-qty').value='';if(/^sl-fruit-[123]$/.test(id)){get('fruit-qty-'+id.slice(-1)).value='';get('fruit-grams-'+id.slice(-1)).value='';get('fruit-cal-'+id.slice(-1)).value='';get('fruit-name-'+id.slice(-1)).value='';}calculate();});
root.addEventListener('change',e=>{if(e.target.matches('input,select,textarea'))calculate();});
get('expand-all').addEventListener('click',()=>root.querySelectorAll('details.section').forEach(x=>x.open=true));
get('collapse-all').addEventListener('click',()=>root.querySelectorAll('details.section').forEach(x=>x.open=false));
// Inspiration presets. Each step is [field id, value], set in order (main choice, then quantity, then flavor).
// Checkboxes are listed by their label in `extras`. The menu always shows recipes alphabetically.
const inspirations=[
 {name:'Cherry Vanilla Pineapple',
  steps:[['milk','water'],['milk-qty','.75'],['powder','on'],['powder-qty','0.5'],['powder-flavor','Vanilla Ice Cream'],['yogurt','dannon'],['yogurt-qty','container'],['yogurt-flavor','Cherry'],['banana-type','fresh'],['banana-qty','6'],['fruit-1','cherries'],['fruit-qty-1','.75'],['fruit-2','pineapple'],['fruit-qty-2','.75'],['greens','spinach'],['greens-qty','.5']],
  extras:['Vanilla extract'],
  note:'Best with frozen cherries, pineapple, and banana, plus loosely packed frozen baby spinach, for a thick, frosty texture. Add ½ tsp vanilla extract.'},
 {name:'Caramel Apple Macchiato',
  steps:[['shake','premier'],['shake-qty','11.5-half'],['shake-flavor','Caramel Macchiato'],['yogurt','dannon'],['yogurt-qty','container'],['yogurt-flavor','Caramel Apple Pie'],['banana-type','fresh'],['banana-qty','9'],['fruit-1','apple'],['fruit-qty-1','1'],['greens','spinach'],['greens-qty','.5']],
  extras:['Cinnamon'],
  note:'Use a small Honeycrisp apple, cored with the skin on. Best with frozen banana and loosely packed frozen baby spinach. Finish with a light shake of cinnamon.'}
];
const inspoBtn=get('inspo'),inspoMenu=get('inspo-menu');
const fire=el=>{el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));};
const resetLayout=()=>root.querySelectorAll('details.section').forEach((d,i,all)=>d.open=i===all.length-1);
function applyInspiration(r){
 get('clear').click();
 const touched=new Set();
 r.steps.forEach(([id,v])=>{const el=get(id);if(!el)return console.warn('Inspiration: missing field',id);el.value=v;fire(el);if(el.value!==v)console.warn('Inspiration: option not found',id,v);touched.add(el);});
 (r.extras||[]).forEach(name=>{const i=extras.indexOf(name),el=i>=0&&get('extra-'+i);if(!el)return console.warn('Inspiration: missing extra',name);el.checked=true;fire(el);touched.add(el);});
 if(r.note){const n=get('notes');n.value=r.note;fire(n);}
 resetLayout();touched.forEach(el=>{const d=el.closest('details.section');if(d)d.open=true;});
}
function closeInspo(focusBtn){inspoMenu.hidden=true;inspoBtn.setAttribute('aria-expanded','false');if(focusBtn)inspoBtn.focus();}
inspoMenu.innerHTML='<button type="button" role="menuitem" class="inspo-clear" data-i="clear">Clear All &amp; Start Fresh</button><hr>'+
 inspirations.map((r,i)=>[r,i]).sort((a,b)=>a[0].name.localeCompare(b[0].name,'en',{sensitivity:'base'})).map(([r,i])=>`<button type="button" role="menuitem" data-i="${i}">${r.name}</button>`).join('');
inspoBtn.addEventListener('click',()=>{const open=inspoMenu.hidden;inspoMenu.hidden=!open;inspoBtn.setAttribute('aria-expanded',String(open));if(open)inspoMenu.querySelector('button').focus();});
inspoMenu.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.i==='clear'){get('clear').click();resetLayout();}else applyInspiration(inspirations[Number(b.dataset.i)]);closeInspo(true);});
document.addEventListener('click',e=>{if(!inspoMenu.hidden&&!e.target.closest('.inspo'))closeInspo(false);});
inspoMenu.addEventListener('keydown',e=>{const items=[...inspoMenu.querySelectorAll('button')],i=items.indexOf(document.activeElement);if(e.key==='Escape'){e.preventDefault();closeInspo(true);}else if(e.key==='ArrowDown'){e.preventDefault();items[(i+1)%items.length].focus();}else if(e.key==='ArrowUp'){e.preventDefault();items[(i-1+items.length)%items.length].focus();}});

get('clear').addEventListener('click',()=>{root.querySelectorAll('input,textarea').forEach(x=>{if(x.type==='checkbox')x.checked=false;else x.value='';});root.querySelectorAll('select').forEach(x=>x.value='');get('copy-status').textContent='';calculate();});
get('copy').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(lastCopy);else{const t=document.createElement('textarea');t.value=lastCopy;t.style.position='fixed';t.style.opacity='0';root.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Copy not available');}get('copy-status').textContent='Copied! Ready to paste into your food log.';}catch(e){get('copy-status').textContent='Clipboard access is blocked by this browser or site.';}});
calculate();
})();
</script>
