<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Smoothie Lab</title>
<meta name="description" content="A little smoothie science! Mix, match, and discover your next favorite blend.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍓</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
html,body{margin:0;padding:0}
body{background-color:#fff3ef;background-image:radial-gradient(#ffd6de 1.2px,transparent 1.2px);background-size:22px 22px;font-family:"Nunito",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;padding:22px 14px 40px;color:#2e1f36}
#smoothie-lab-calculator{color:#2e1f36;max-width:760px;margin:0 auto;line-height:1.5;font-size:16px}
#smoothie-lab-calculator *{box-sizing:border-box}
#smoothie-lab-calculator .sl-wrap{background:#fff;border-radius:28px;padding:0 22px 22px;overflow:hidden;box-shadow:0 14px 40px rgba(214,51,95,.14)}
#smoothie-lab-calculator .hero{margin:0 -22px 18px}
#smoothie-lab-calculator .hero img{display:block;width:100%;height:240px;object-fit:cover}
#smoothie-lab-calculator .stripe{height:12px;background:linear-gradient(90deg,#ff4f79 0 20%,#ff9f1c 20% 40%,#ffd23f 40% 60%,#7bc950 60% 80%,#6b7bff 80% 100%)}
#smoothie-lab-calculator .hero.no-photo img{display:none}
#smoothie-lab-calculator h2,#smoothie-lab-calculator h3{font-family:"Fredoka","Nunito",sans-serif;font-weight:600}
#smoothie-lab-calculator h2{font-size:2.2rem;line-height:1.1;margin:6px 0 4px;color:#d6335f}
#smoothie-lab-calculator .sub{color:#6d5a72;margin:0 0 18px;font-size:.95rem}
#smoothie-lab-calculator .dash{background:linear-gradient(135deg,#ff4f79 0%,#ff7a45 50%,#ffb627 100%);border-radius:24px;padding:20px 16px;text-align:center;margin-bottom:6px;color:#fff;position:sticky;top:8px;z-index:5;box-shadow:0 8px 22px rgba(255,79,121,.3)}
#smoothie-lab-calculator .eyebrow{font-size:.78rem;font-weight:800;letter-spacing:.06em;color:#fff;opacity:.95}
#smoothie-lab-calculator .big{font-family:"Fredoka","Nunito",sans-serif;font-weight:700;font-size:3rem;line-height:1.1;margin:4px 0 12px;text-shadow:0 2px 0 rgba(0,0,0,.08)}
#smoothie-lab-calculator .macros{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:7px}
#smoothie-lab-calculator .macro{background:#fff;border-radius:14px;padding:8px 4px}
#smoothie-lab-calculator .macro small{display:block;font-size:.75rem;font-weight:700}
#smoothie-lab-calculator .macro strong{font-size:.95rem;color:#2e1f36}
#smoothie-lab-calculator .macro:nth-child(1) small{color:#d6335f}
#smoothie-lab-calculator .macro:nth-child(2) small{color:#3a8a2c}
#smoothie-lab-calculator .macro:nth-child(3) small{color:#b86200}
#smoothie-lab-calculator .macro:nth-child(4) small{color:#4458c9}
#smoothie-lab-calculator .macro:nth-child(5) small{color:#8c44bb}
#smoothie-lab-calculator .dash .note{color:#fff}
#smoothie-lab-calculator .section{--accent:#d6335f;--tint:#fff0f4;background:var(--tint);border-radius:20px;padding:16px;margin-top:14px}
#smoothie-lab-calculator h3{font-size:1.2rem;margin:0 0 12px;color:var(--accent)}
#smoothie-lab-calculator .cols{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
#smoothie-lab-calculator label{font-size:.85rem;font-weight:700;display:block;margin-bottom:5px}
#smoothie-lab-calculator textarea{display:block;width:100%;min-height:76px;border:2px solid #fff;border-radius:12px;padding:10px;background:#fff;color:#2e1f36;font:inherit;font-size:.9rem;resize:vertical;box-shadow:0 1px 3px rgba(46,31,54,.08)}
#smoothie-lab-calculator input:not([type=checkbox]),#smoothie-lab-calculator select{display:block;width:100%;min-width:0;border:2px solid #fff;border-radius:12px;padding:10px;background:#fff;color:#2e1f36;font:inherit;font-size:.9rem;min-height:44px;box-shadow:0 1px 3px rgba(46,31,54,.08)}
#smoothie-lab-calculator textarea:focus,#smoothie-lab-calculator input:not([type=checkbox]):focus,#smoothie-lab-calculator select:focus{outline:none;border-color:var(--accent)}
#smoothie-lab-calculator select:disabled{opacity:.6}
#smoothie-lab-calculator .field{margin-top:10px}
#smoothie-lab-calculator .hidden{display:none!important}
#smoothie-lab-calculator .checkgrid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(4,auto);grid-auto-flow:column;gap:10px}
#smoothie-lab-calculator .checkgrid label{font-weight:600;display:flex;align-items:center;gap:8px;margin:0;background:#fff;border-radius:12px;padding:9px 10px;cursor:pointer}
#smoothie-lab-calculator input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);flex:none}
#smoothie-lab-calculator .note{font-size:.8rem;color:#6d5a72;margin:10px 0 0}
#smoothie-lab-calculator .summary-line{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:2px dotted rgba(46,31,54,.12);font-size:.92rem}
#smoothie-lab-calculator .summary-line span:last-child{white-space:nowrap;font-weight:700}
#smoothie-lab-calculator .sum-total{display:flex;justify-content:space-between;font-family:"Fredoka","Nunito",sans-serif;font-weight:600;font-size:1.25rem;padding:12px 0;color:var(--accent)}
#smoothie-lab-calculator .sum-macro{display:flex;justify-content:space-between;font-size:.88rem;padding:3px 0}
#smoothie-lab-calculator .buttons{display:flex;gap:10px;margin:16px 0 8px}
#smoothie-lab-calculator button{cursor:pointer;border:0;border-radius:999px;padding:13px 18px;font:inherit;font-weight:800;font-size:.95rem;transition:transform .1s}
#smoothie-lab-calculator button:active{transform:scale(.97)}
#smoothie-lab-calculator button:focus-visible{outline:3px solid #6b7bff;outline-offset:2px}
#smoothie-lab-calculator .copy{flex:1;background:linear-gradient(135deg,#ff4f79,#ff7a45);color:#fff;box-shadow:0 6px 16px rgba(255,79,121,.3)}
#smoothie-lab-calculator .clear{background:#fff;color:#2e1f36;border:2px solid rgba(46,31,54,.15)}
#smoothie-lab-calculator .status{font-size:.85rem;font-weight:700;color:var(--accent);min-height:1.2em}
#smoothie-lab-calculator .warn{color:#b86200}
@media(max-width:530px){body{padding:10px 6px 30px}#smoothie-lab-calculator .sl-wrap{padding:0 12px 14px;border-radius:22px}#smoothie-lab-calculator .hero{margin:0 -12px 14px}#smoothie-lab-calculator .hero img{height:180px}#smoothie-lab-calculator h2{font-size:1.85rem}#smoothie-lab-calculator .section{padding:13px}#smoothie-lab-calculator .macros{grid-template-columns:repeat(5,minmax(0,1fr));gap:4px}#smoothie-lab-calculator .macro small{font-size:.66rem}#smoothie-lab-calculator .macro strong{font-size:.8rem}#smoothie-lab-calculator .big{font-size:2.5rem}#smoothie-lab-calculator .cols{gap:7px}#smoothie-lab-calculator input:not([type=checkbox]),#smoothie-lab-calculator select{font-size:14px;padding:9px 6px}#smoothie-lab-calculator .checkgrid label{font-size:.85rem}}
@media(prefers-reduced-motion:reduce){#smoothie-lab-calculator button{transition:none}}
</style>
</head>
<body>
<div id="smoothie-lab-calculator"></div>
<script>
(function(){
'use strict';
const root=document.getElementById('smoothie-lab-calculator');if(!root||root.dataset.ready)return;root.dataset.ready='1';
// Nutrient array order: protein, fiber, total carbs, fat, total sugar.
// Brand-specific entries are estimates; verify current packaging for exact products and flavors.
const cups=[['.25','¼ cup'],[String(1/3),'⅓ cup'],['.5','½ cup'],[String(2/3),'⅔ cup'],['.75','¾ cup'],['1','1 cup'],['1.5','1½ cups'],['2','2 cups']];
const milk={water:['Water',0,[0,0,0,0,0]],almond:['Unsweetened almond milk',30,[1,0,1,2.5,0]],whole:['Whole milk',150,[8,0,12,8,12]],two:['2% milk',120,[8,0,12,5,12]],skim:['Skim milk',80,[8,0,12,0,12]],oat:['Oat milk (original)',120,[3,2,16,5,7]],fairlife:['Fairlife chocolate milk',140,[13,0,13,4.5,12]],coldbrew:['Cold brew coffee (unsweetened)',0,[0,0,0,0,0]],greenTea:['Green tea (brewed, unsweetened)',0,[0,0,0,0,0]],blackTea:['Black tea (brewed, unsweetened)',0,[0,0,0,0,0]],herbalTea:['Herbal tea (brewed, unsweetened)',0,[0,0,0,0,0]]};
const shakes={premier:['Premier Protein',160,[30,3,5,3,1],'11 oz',['Mocha','Caramel Macchiato','Cookies & Cream','Chocolate','Vanilla','Café Latte','Strawberries & Cream']],fairlifeplan:['fairlife Nutrition Plan',150,[30,0,4,2.5,2],'11.5 oz',['Chocolate','Vanilla']],core26:['fairlife Core Power (26g protein)',170,[26,0,8,4.5,5],'14 oz',['Chocolate','Vanilla','Strawberry Banana']],core42:['fairlife Core Power Elite (42g protein)',230,[42,0,9,3.5,7],'14 oz',['Chocolate','Vanilla','Strawberry']]};
const powders={on:['Optimum Nutrition Gold Standard Whey',120,[24,0,3,1,1],['Double Rich Chocolate','Extreme Milk Chocolate','Vanilla Ice Cream'],1],premier:['Premier Protein powder',150,[30,1,4,2,1],['Chocolate Milkshake','Vanilla Milkshake'],2]};
const bananas=[['½ frozen 6-inch banana',45,[.55,1.3,11.5,.15,6]],['1 frozen 6-inch banana',90,[1.1,2.6,23,.3,12]],['2 frozen 6-inch bananas',180,[2.2,5.2,46,.6,24]]];
// Frozen banana chunks: estimate per cup (~150 g sliced banana), scaled for cup portions.
const frozenBananaCup={cal:134,n:[1.65,3.9,34.5,.45,18]};
const bananaChunkCups=cups.filter(([q])=>Number(q)===.25||Number(q)===.5||Number(q)===.75||Number(q)===1||Number(q)===1.5);
const avocados={frozen:{name:'Frozen avocado cubes (bag values)',choices:[['⅓ cup',50,[.6,2.1,2.7,4.6,.2]],['⅔ cup',100,[1.2,4.2,5.4,9.2,.4]],['1 cup',150,[1.8,6.3,8.1,13.8,.6]]]},fresh:{name:'Fresh avocado (medium)',choices:[['¼ medium avocado',60,[.75,2.5,3.2,5.5,.25]],['½ medium avocado',120,[1.5,5,6.4,11,.5]],['1 medium avocado',240,[3,10,12.8,22,1]]]},wegmans:{name:'Wegmans Just Avocado Chunky',choices:[['1 whole mini cup (57g)',130,[1,3,5,11,1]]]}};
const tofuReference={name:'Soft silken tofu (Mori-Nu)',grams:85,cal:45,nutrients:[4,.2,1.5,2.5,.4]};
const peanutButter=[['1 tbsp regular peanut butter',95,[3.5,1,3.5,8,1.5]],['2 tbsp regular peanut butter',190,[7,2,7,16,3]]];
const pb2Options={original:{name:'PB2 Original',cal:60,n:[6,1.5,5,1.5,2]},cocoa:{name:'PB2 Cocoa Peanut Powder',cal:50,n:[4,1,6,1,4]},almond:{name:'PB2 Powdered Almond Butter',cal:50,n:[5,1,5,1.5,2]}};
const nutella=[['1 tbsp Nutella',100,[1,.5,11,5.5,10.5]],['2 tbsp Nutella',200,[2,1,22,11,21]]];
const walnuts=[['2 walnut halves',26,[.6,.3,.6,2.6,.1]],['5 walnut halves',65,[1.5,.7,1.4,6.5,.3]],['10 walnut halves',130,[3,1.4,2.8,13,.6]],['14 walnut halves (about ¼ cup)',185,[4.3,1.9,3.9,18.5,.7]]];
const fruits={cherries:['Cherries',93,[1.5,3.2,24,.3,19]],raspberries:['Raspberries',64,[1.5,8,15,.8,5.4]],strawberries:['Strawberries',50,[1,3,12,.5,7.5]],blueberries:['Blueberries',84,[1.1,3.6,21.5,.5,15]],blackberries:['Blackberries',62,[2,7.6,14,.7,7]],assorted:['Assorted berries',70,[1.3,5,16,.5,10]],pineapple:['Pineapple',80,[.9,2.3,21,.2,16]],mango:['Mango',99,[1.4,2.6,25,.6,23]],peaches:['Peaches',60,[1.4,2.3,15,.4,13]]};
const apples=[['½ small apple',35,[.15,1.65,9.5,.1,7]],['1 small apple',70,[.3,3.3,19,.2,14]],['1 medium apple',95,[.5,4.4,25,.3,19]],['1 large apple',115,[.6,5.4,31,.4,23]],['2 small apples',140,[.6,6.6,38,.4,28]]];
// Per 100g frozen packet, using SAMBAZON product nutrition labels.
const acai={acaiGuarana:['Açai (sweetened with guaraná)',100,[1,3,15,4,12]],acaiPlain:['Açai',70,[1,3,4,5,0]]};
// Per loosely packed cup, raw. Approximate values.
const greens={spinach:['Spinach',7,[.9,.7,1.1,.1,.1]],kale:['Kale',7,[.6,.7,1.4,.1,.3]]};
// Per tablespoon, generic reference values. Each seed may be chosen independently.
const seeds={chia:['Chia seeds',60,[2,4.1,5.1,3.8,0]],flax:['Ground flaxseed',37,[1.3,1.9,2,3,.1]],hemp:['Hemp hearts',57,[3.2,.4,.9,4.9,.2]]};
// Plain, dry oats: reference nutrition per dry tablespoon; steel-cut oats are denser by volume.
const oats={rolled:['Rolled oats',19,[.63,.5,3.38,.38,.13]],quick:['Quick oats',19,[.63,.5,3.38,.38,.13]],instant:['Plain instant oats',19,[.63,.5,3.38,.38,.13]],steel:['Steel-cut oats (softened)',38,[1.25,1,6.75,.63,.25]]};
const oatQuantities=[['1','1 tbsp'],['2','2 tbsp'],['4','¼ cup'],['8','½ cup']];
const yogurtCups={cocojune:['Cocojune Pure Coconut (4 oz / 114g)',190,[2,2,6,18,2]],yoplait:['Yoplait Original Strawberry (6 oz / 170g)',140,[5,0,26,1.5,18]]};
const yogurtPerCupGrams=245; // Approximate yogurt volume conversion; individual products may vary in density.
const yogurtFlavors=['Cherry','Boston Cream Pie','Caramel Apple Pie','Strawberry Cheesecake','Toasted Marshmallow','Raspberry Chocolate','Strawberry','Vanilla','Blueberry','Peach','Banana Cream','Toasted Coconut Vanilla','Tiramisu'];
const extras=['Ice','Vanilla','Cinnamon','Almond extract','Ground ginger','Lemon juice','Lime juice','Sea Salt'];
// Nutrition per reference amount (calories, then protein/fiber/carbs/fat/sugar).
const sweeteners={honey:['Honey',21,[0,0,5.8,0,5.8]],maple:['Pure maple syrup',17,[0,0,4.5,0,4]],agave:['Agave nectar',21,[0,0,5.3,0,4.7]],sugar:['Granulated sugar',16,[0,0,4,0,4]],stevia:['Stevia packet',0,[0,0,0,0,0]],monk:['Monk fruit sweetener (zero-calorie blend)',0,[0,0,0,0,0]],torani:['Torani Sugar Free syrup',0,[0,0,0,0,0]]};
const kickOptions=[['','None'],['caffeine','Straight caffeine'],['coffee','Instant coffee'],['espresso','Espresso'],['matcha','Matcha'],['crystal','Crystal Light packet'],['morning','Morning energy packet'],['cocoaUnsweetened','Unsweetened cocoa powder'],['cocoaSweetened','Sweetened cocoa powder']];
const cocoa={
 cocoaUnsweetened:{label:'unsweetened cocoa powder',cal:12,n:[1,2,3,.75,.15]},
 // Generic sweetened cocoa powder/mix estimate, per tbsp. Product labels vary considerably.
 cocoaSweetened:{label:'sweetened cocoa powder',cal:45,n:[.4,.4,10,.5,9]}
};
const cocoaMeasures=[['1','1 tsp'],['3','1 tbsp'],['6','2 tbsp']];

const kickPackets=['Crystal Light packet','Morning energy packet'];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const opts=arr=>arr.map(([v,t])=>`<option value="${esc(v)}">${esc(t)}</option>`).join('');
const sel=(id,choices)=>`<select id="sl-${id}">${opts(choices)}</select>`;
const inp=(id,h,type='text')=>`<input id="sl-${id}" type="${type}" ${type==='number'?'min="0" step="any"':''} placeholder="${esc(h)}">`;
const field=(id,label,control)=>`<div><label for="sl-${id}">${esc(label)}</label>${control}</div>`;
const selectField=(id,label,choices)=>field(id,label,sel(id,choices));
const basic=(id,arr)=>sel(id,[['','None'],...arr.map((a,i)=>[String(i),`${a[0]} · ${a[1]} cal`])]);
const section=(title,body)=>`<div class="section"><h3>${title}</h3>${body}</div>`;
const manual=(prefix,description)=>`<div id="sl-${prefix}-manual" class="field hidden"><div class="cols">${field(prefix+'-name',description,inp(prefix+'-name','Name and Quantity'))}${field(prefix+'-cal','Calories',inp(prefix+'-cal','Calories','number'))}</div></div>`;
const eachSeed=(key)=>`<div class="field">${selectField('seed-'+key,seeds[key][0],[['','None'],['1','1 tsp'],['2','2 tsp'],['3','1 tbsp'],['6','2 tbsp']])}</div>`;
const eachGreen=(key)=>`<div class="field">${selectField('green-'+key,greens[key][0],[['','None'],['.5','½ cup'],['1','1 cup'],['2','2 cups']])}</div>`;
root.innerHTML=`<div class="sl-wrap"><div class="hero"><img src="header.jpg" alt="Smoothie" onerror="this.closest('.hero').classList.add('no-photo')"><div class="stripe"></div></div><h2>The Smoothie Lab</h2><p class="sub">A little smoothie science! Mix, match, and discover your next favorite blend.</p><div class="dash"><div class="eyebrow">NUTRITION DASHBOARD</div><div class="big"><span id="sl-calories">0</span> cal</div><div class="macros">${['Protein','Fiber','Carbs','Fat','Sugar'].map((m,i)=>`<div class="macro"><small>${m}</small><strong id="sl-macro-${i}">0.0 g</strong></div>`).join('')}</div><div id="sl-partial-top" class="note hidden">Macro totals are partial because manual ingredients have unknown nutrients.</div></div>
${section('1. Start with a Splash',`<div class="cols">${selectField('milk','Milk & More',[['','None'],...Object.entries(milk).map(([k,x])=>[k,x[0]]),['other','Other (manual entry)']])}<div id="sl-milk-qty-holder">${selectField('milk-qty','Quantity',[['','Select quantity']])}</div></div>${manual('milk','Name and Quantity')}`)}
${section('2. Shake It Up',`<div class="cols">${selectField('shake','Protein Shake',[['','None'],...Object.entries(shakes).map(([k,x])=>[k,x[0]])])}${selectField('shake-qty','Quantity',[['','Select quantity']])}</div><div class="field hidden" id="sl-shake-flavor-holder">${selectField('shake-flavor','Flavor',[['','Select flavor']])}<div class="field hidden" id="sl-shake-other-wrap">${field('shake-other','Other Flavor',inp('shake-other','Flavor'))}</div></div>`)}
${section('3. Power Boost',`<div class="cols">${selectField('powder','Protein Powder',[['','None'],...Object.entries(powders).map(([k,x])=>[k,x[0]]),['other','Other (manual entry)']])}${selectField('powder-qty','Quantity',[['','Select quantity']])}</div><div id="sl-powder-flavor-holder" class="field hidden">${selectField('powder-flavor','Flavor',[['','Select flavor']])}<div class="field hidden" id="sl-powder-other-wrap">${field('powder-other','Other Flavor',inp('powder-other','Flavor'))}</div></div>${manual('powder','Product and Quantity')}`)}
${section('4. Get Cultured',`<div class="cols">${selectField('yogurt','Yogurt',[['','None'],['dannon','Dannon Light + Fit Greek'],['chobani','Chobani Plain Nonfat Greek'],['cocojune','Cocojune Pure Coconut'],['yoplait','Yoplait Original Strawberry'],['other','Other (manual entry)']])}<div id="sl-yogurt-qty-holder">${selectField('yogurt-qty','Quantity',[['','Select quantity']])}</div></div><div id="sl-yogurt-flavor-holder" class="field hidden">${selectField('yogurt-flavor','Flavor',[['','Select flavor'],...yogurtFlavors.map(x=>[x,x]),['Other','Other']])}<div id="sl-yogurt-other-wrap" class="field hidden">${field('yogurt-other','Other Flavor',inp('yogurt-other','Flavor'))}</div></div>${manual('yogurt','Yogurt and Quantity')}`)}
${section('5. Go Bananas',`<div class="cols">${selectField('banana-type','Banana',[['','None'],['fresh','Fresh'],['frozen','Frozen']])}${selectField('banana-qty','Quantity',[['','Select quantity']])}</div>`)}
${section('6. Feeling Fruity',`${[1,2,3].map(i=>`<div class="field"><label for="sl-fruit-${i}">Fruit #${i}</label><div class="cols">${sel('fruit-'+i,[['','None'],...Object.entries(fruits).map(([k,v])=>[k,v[0]]),['apple','Apple'],...Object.entries(acai).map(([k,v])=>[k,v[0]])].sort((a,b)=>a[0]===''?-1:b[0]===''?1:a[1].localeCompare(b[1],'en',{sensitivity:'base'})))}<div id="sl-fruit-qty-${i}-holder">${sel('fruit-qty-'+i,[['','Select quantity']])}</div><div id="sl-fruit-grams-${i}-holder" class="hidden">${field('fruit-grams-'+i,'Grams',inp('fruit-grams-'+i,'Enter grams','number'))}</div></div></div>`).join('')}`)}
${section('7. Awesome Avo',`<div class="cols">${selectField('avocado-type','Avocado Type',[['','None'],...Object.entries(avocados).map(([k,x])=>[k,x.name])])}${selectField('avocado-qty','Quantity',[['','Select quantity']])}</div><p class="note">Frozen and Wegmans avocado options use package information; fresh avocado uses standard estimates.</p>`)}
${section('8. Green Goodness',`${eachGreen('spinach')}${eachGreen('kale')}`)}
${section('9. Silky Smooth',`<div class="cols">${selectField('tofu','Silken Tofu',[['','None'],['mori','Soft silken tofu (Mori-Nu)']])}${field('tofu-grams','Grams',inp('tofu-grams','Enter grams','number'))}</div>`)}
${section('10. A Little Nutty',`<div class="field">${selectField('peanut','Peanut Butter',[['','None'],...peanutButter.map((x,i)=>[String(i),`${x[0]} · ${x[1]} cal`])])}</div><div class="field"><div class="cols">${selectField('pb2','PB2',[['','None'],['original','Original'],['cocoa','Cocoa'],['almond','Almond']])}${selectField('pb2-qty','Quantity',[['','Select quantity']])}</div></div><div class="field">${selectField('nutella','Nutella',[['','None'],...nutella.map((x,i)=>[String(i),`${x[0]} · ${x[1]} cal`])])}</div><div class="field">${selectField('walnut','Walnuts',[['','None'],...walnuts.map((x,i)=>[String(i),`${x[0]} · ${x[1]} cal`])])}</div>`)}
${section('11. Seeds & Such',`${eachSeed('chia')}${eachSeed('flax')}${eachSeed('hemp')}<div class="field"><div class="cols">${selectField('oat-type','Oats',[['','None'],...Object.entries(oats).map(([k,v])=>[k,v[0]])])}${selectField('oat-qty','Quantity',[['','Select quantity']])}</div></div>`)}

${section('14. Secret Ingredients',`${[1,2].map(i=>`<div class="field"><label for="sl-custom-name-${i}">Custom Ingredient #${i}</label><div class="cols">${inp('custom-name-'+i,'Ingredient and quantity')}${inp('custom-cal-'+i,'Calories','number')}</div></div>`).join('')}<p class="note">Custom ingredients count toward calories only; other nutrients are unknown.</p>`)}

${section('16. The Final Creation',`<div id="sl-ingredients"><p class="note">No ingredients selected.</p></div><div class="sum-total"><span>TOTAL ESTIMATED CALORIES</span><span id="sl-summary-cal">0 cal</span></div><div id="sl-summary-macros"></div><p id="sl-partial-summary" class="note hidden">Macro totals are incomplete because manually entered ingredients have unknown nutritional values.</p><div class="buttons"><button type="button" class="copy" id="sl-copy">Copy Smoothie</button><button type="button" class="clear" id="sl-clear">Clear All</button></div><div class="status" id="sl-copy-status" aria-live="polite"></div><p class="note">Nutrition values are estimates and may vary by brand, flavor, serving size, and preparation. Manually entered ingredients count toward calories only.</p><p class="note">Have a suggestion or idea for The Smoothie Lab? <a href="https://idreamofcreami.wordpress.com/smoothie-lab-feedback/" target="_blank" rel="noopener noreferrer" style="color:var(--accent);font-weight:700;text-decoration:underline">I’d love to hear from you!</a></p>`)}
</div>`;
const palette=[['#d6335f','#fff0f4'],['#b86200','#fff5e3'],['#3a8a2c','#f0f9ea'],['#4458c9','#eef0ff'],['#8c44bb','#f6eefc']];root.querySelectorAll('.section').forEach((s,i)=>{const p=palette[i%palette.length];s.style.setProperty('--accent',p[0]);s.style.setProperty('--tint',p[1]);});
const get=id=>root.querySelector('#sl-'+id),val=id=>get(id)?.value||'',show=(id,yes)=>get(id)?.classList.toggle('hidden',!yes),format=n=>n.toFixed(1),valid=s=>s.trim()!==''&&Number.isFinite(Number(s))&&Number(s)>=0;
const setChoices=(id,choices)=>{const node=get(id),old=node.value;node.innerHTML=opts(choices);if(choices.some(x=>x[0]===old))node.value=old;node.disabled=choices.length<=1;};
function refreshDependent(){
 const m=val('milk');setChoices('milk-qty',[['','Select quantity'],...(milk[m]?cups.map(([v,t])=>[v,`${t} · ${Math.round(milk[m][1]*Number(v))} cal`]):[])]);show('milk-qty-holder',m!=='other');show('milk-manual',m==='other');
 const s=shakes[val('shake')];setChoices('shake-qty',[['','Select quantity'],...(s?[['half',`½ shake (${(parseFloat(s[3])/2).toString()} oz) · ${Math.round(s[1]/2)} cal`],['full',`1 full shake (${s[3]}) · ${s[1]} cal`]]:[])]);show('shake-flavor-holder',!!s);setChoices('shake-flavor',[['','Select flavor'],...(s?s[4].map(x=>[x,x]):[]),...(s?[['Other','Other']]:[])]);show('shake-other-wrap',!!s&&val('shake-flavor')==='Other');
 const p=powders[val('powder')];setChoices('powder-qty',[['','Select quantity'],...(p?[[String(p[4]/2),`${p[4]/2} scoop${p[4]/2===1?'':'s'} · ${Math.round(p[1]/2)} cal`],[String(p[4]),`${p[4]} scoop${p[4]===1?'':'s'} · ${p[1]} cal`]]:[])]);show('powder-flavor-holder',!!p);setChoices('powder-flavor',[['','Select flavor'],...(p?p[3].map(x=>[x,x]):[]),...(p?[['Other','Other']]:[])]);show('powder-other-wrap',!!p&&val('powder-flavor')==='Other');show('powder-manual',val('powder')==='other');
 const y=val('yogurt');show('yogurt-flavor-holder',y==='dannon');show('yogurt-other-wrap',y==='dannon'&&val('yogurt-flavor')==='Other');const yogurtRef=y==='dannon'?{cal:80,grams:150,oz:'5.3',name:'Dannon Light + Fit Greek'}:y==='chobani'?{cal:90,grams:yogurtPerCupGrams*.75,name:'Chobani Plain Nonfat Greek'}:yogurtCups[y]?{cal:yogurtCups[y][1],grams:y==='cocojune'?114:170,oz:y==='cocojune'?'4':'6',name:yogurtCups[y][0]}:null;
 const yogurtQty=[['','Select quantity']];if(yogurtRef){if(yogurtRef.oz){if(y==='cocojune'||y==='yoplait')yogurtQty.push(['half-container',`½ container · ${Math.round(yogurtRef.cal/2)} cal`]);yogurtQty.push(['container',`${yogurtRef.oz} oz container · ${yogurtRef.cal} cal`]);}yogurtQty.push(...cups.filter(([v])=>[.25,.5,.75,1].includes(Number(v))).map(([v,t])=>[v,`${t} · ${Math.round(yogurtRef.cal*yogurtPerCupGrams*Number(v)/yogurtRef.grams)} cal`]));}setChoices('yogurt-qty',yogurtQty);show('yogurt-manual',y==='other');

 const bt=val('banana-type');setChoices('banana-qty',[['','Select quantity'],...(bt==='fresh'?[['half','½ banana · 45 cal'],['whole','1 banana · 90 cal']]:bt==='frozen'?bananaChunkCups.map(([v,t])=>[v,`${t} · ${Math.round(Number(v)*frozenBananaCup.cal)} cal`]):[])]);
 const pb=pb2Options[val('pb2')];setChoices('pb2-qty',[['','Select quantity'],...(pb?[['2',`2 tbsp · ${pb.cal} cal`],['4',`4 tbsp · ${pb.cal*2} cal`]]:[])]);
 const sw=val('sweetener');let sq=[['','Select quantity']];if(['honey','maple','agave','sugar'].includes(sw))sq.push(['1','1 tsp'],['2','2 tsp'],['3','1 tbsp']);else if(sw==='stevia')sq.push(['1','1 packet'],['2','2 packets']);else if(sw==='monk')sq.push(['1','1 tsp'],['2','2 tsp'],['3','1 tbsp']);else if(sw==='torani')sq.push(['1','1 tsp'],['3','1 tbsp'],['6','2 tbsp']);setChoices('sweetener-qty',sq);show('torani-flavor-wrap',sw==='torani');
 for(let i=1;i<=2;i++){const k=val('kick-'+i);let q=[['','Select quantity']];if(k==='caffeine')q.push(['50','50 mg'],['100','100 mg'],['150','150 mg'],['200','200 mg']);else if(k==='coffee'||k==='matcha')q.push(['.5','½ tsp'],['1','1 tsp'],['2','2 tsp']);else if(k==='espresso')q.push(['1','1 shot'],['2','2 shots']);else if(k==='crystal'||k==='morning')q.push(['half','½ packet'],['full','1 packet']);else if(cocoa[k])q.push(...cocoaMeasures.map(([v,t])=>[v,`${t} · ${Math.round(cocoa[k].cal*Number(v)/3)} cal`]));setChoices('kick-qty-'+i,q);show('kick-flavor-'+i+'-wrap',k==='crystal'||k==='morning');}
 const oat=oats[val('oat-type')];setChoices('oat-qty' ,[['','Select quantity'],...(oat?oatQuantities.map(([v,t])=>[v,`${t} · ${Math.round(oat[1]*Number(v))} cal`]):[])]);
 const a=avocados[val('avocado-type')];setChoices('avocado-qty',[['','Select quantity'],...(a?a.choices.map((x,i)=>[String(i),`${x[0]} · ${x[1]} cal`]):[])]);
 for(let i=1;i<=3;i++){const f=val('fruit-'+i);let options=[['','Select quantity']];if(f==='apple')options.push(...apples.map((x,j)=>[String(j),`${x[0]} · ${x[1]} cal`]));else if(fruits[f])options.push(...cups.map(([v,t])=>[v,`${t} · ${Math.round(fruits[f][1]*Number(v))} cal`]));show('fruit-qty-'+i+'-holder',!acai[f]);show('fruit-grams-'+i+'-holder',!!acai[f]);setChoices('fruit-qty-'+i,options);}
}
let lastCopy='';
function calculate(){refreshDependent();const items=[];const add=(name,cal,n,isManual=false)=>items.push({name,cal,n,isManual});
const addManual=(prefix)=>{if(val(prefix+'-name').trim()&&valid(val(prefix+'-cal')))add(val(prefix+'-name').trim(),Number(val(prefix+'-cal')),[0,0,0,0,0],true);};
const addSimple=(arr,id)=>{let v=val(id);if(v!==''&&arr[Number(v)])add(...arr[Number(v)]);};
const m=milk[val('milk')];if(m&&val('milk-qty')){let s=Number(val('milk-qty')),c=cups.find(x=>x[0]===val('milk-qty'));if(c)add(`${c[1]} ${m[0]}`,m[1]*s,m[2].map(x=>x*s));}else if(val('milk')==='other')addManual('milk');
const sh=shakes[val('shake')];if(sh&&val('shake-qty')){let factor=val('shake-qty')==='half'?.5:1;let flavor=val('shake-flavor')==='Other'?val('shake-other').trim():val('shake-flavor');add(`${factor===.5?'½':'1'} ${sh[0]} shake${flavor?' ('+flavor+')':''}`,sh[1]*factor,sh[2].map(x=>x*factor));}
const pw=powders[val('powder')];if(pw&&val('powder-qty')){let s=Number(val('powder-qty')),factor=s/pw[4],fl=val('powder-flavor')==='Other'?val('powder-other').trim():val('powder-flavor');const nutrients=(val('powder')==='premier'&&fl==='Vanilla Milkshake')?[30,0,3,2,1]:pw[2];add(`${s} scoop${s===1?'':'s'} ${pw[0]}${fl?' ('+fl+')':''}`,pw[1]*factor,nutrients.map(x=>x*factor));}else if(val('powder')==='other')addManual('powder');
const y=val('yogurt'),yq=val('yogurt-qty');if(y==='other')addManual('yogurt');else if(yq){
 let ref=null;if(y==='dannon')ref={name:'Dannon Light + Fit Greek yogurt',cal:80,n:[12,0,9,0,7],grams:150};else if(y==='chobani')ref={name:'Chobani Plain Nonfat Greek yogurt',cal:90,n:[16,0,6,0,6],grams:yogurtPerCupGrams*.75};else if(yogurtCups[y])ref={name:yogurtCups[y][0],cal:yogurtCups[y][1],n:yogurtCups[y][2],grams:y==='cocojune'?114:170};
 if(ref){const quantity=cups.find(([v])=>v===yq),scale=yq==='container'?1:yq==='half-container'?.5:quantity?yogurtPerCupGrams*Number(yq)/ref.grams:0;if(scale){const flavor=y==='dannon'?(val('yogurt-flavor')==='Other'?val('yogurt-other').trim():val('yogurt-flavor')):'';const portion=yq==='container'?'1 container':yq==='half-container'?'½ container':quantity[1];add(`${portion} ${ref.name}${flavor?' ('+flavor+')':''}`,ref.cal*scale,ref.n.map(v=>v*scale));}}
}
const bt=val('banana-type'),bq=val('banana-qty');if(bt==='fresh'&&(bq==='half'||bq==='whole')){const selected=bananas[bq==='half'?0:1];add(`${bq==='half'?'½':'1'} fresh banana`,selected[1],selected[2]);}else if(bt==='frozen'&&bq){const c=bananaChunkCups.find(([v])=>v===bq);if(c){const scale=Number(bq);add(`${c[1]} frozen banana chunks`,frozenBananaCup.cal*scale,frozenBananaCup.n.map(n=>n*scale));}}const av=avocados[val('avocado-type')];if(av&&val('avocado-qty')!==''){let a=av.choices[Number(val('avocado-qty'))];if(a)add(`${a[0]} ${av.name}`,a[1],a[2]);}if(val('tofu')==='mori'&&valid(val('tofu-grams'))&&Number(val('tofu-grams'))>0){const g=Number(val('tofu-grams')),factor=g/tofuReference.grams;add(`${g} g ${tofuReference.name}`,tofuReference.cal*factor,tofuReference.nutrients.map(n=>n*factor));}
Object.keys(greens).forEach(k=>{if(val('green-'+k)){let s=Number(val('green-'+k)),g=greens[k];add(`${s===.5?'½':s} cup${s===1?'':'s'} raw ${g[0].toLowerCase()}`,g[1]*s,g[2].map(x=>x*s));}});
for(let i=1;i<=3;i++){let f=val('fruit-'+i),q=val('fruit-qty-'+i);if(f==='apple'&&q!==''&&apples[Number(q)])add(...apples[Number(q)]);else if(fruits[f]&&q){let c=cups.find(x=>x[0]===q);if(c){let x=fruits[f],s=Number(q);add(`${c[1]} ${x[0].toLowerCase()}`,x[1]*s,x[2].map(n=>n*s));}}else if(acai[f]&&valid(val('fruit-grams-'+i))&&Number(val('fruit-grams-'+i))>0){let x=acai[f],g=Number(val('fruit-grams-'+i)),s=g/100;add(`${g} g ${x[0]}`,x[1]*s,x[2].map(n=>n*s));}}
addSimple(peanutButter,'peanut');
const pb=pb2Options[val('pb2')],pbQty=val('pb2-qty');if(pb&&pbQty){const scale=Number(pbQty)/2;add(`${pbQty} tbsp ${pb.name}`,pb.cal*scale,pb.n.map(v=>v*scale));}
addSimple(nutella,'nutella');addSimple(walnuts,'walnut');
Object.keys(seeds).forEach(k=>{if(val('seed-'+k)){let tsp=Number(val('seed-'+k)),s=tsp/3,x=seeds[k];add(`${tsp===1?'1 tsp':tsp===2?'2 tsp':tsp===3?'1 tbsp':'2 tbsp'} ${x[0].toLowerCase()}`,x[1]*s,x[2].map(n=>n*s));}});
const oat=oats[val('oat-type')];if(oat&&val('oat-qty')){const tbsp=Number(val('oat-qty'));const q=oatQuantities.find(([v])=>v===val('oat-qty'));if(q)add(`${q[1]} ${oat[0].toLowerCase()}`,oat[1]*tbsp,oat[2].map(n=>n*tbsp));}
// Caffeinated additions: mg is an informational amount, not nutrition.
for(let i=1;i<=2;i++){const k=val('kick-'+i),q=val('kick-qty-'+i);if(!k||!q)continue;let name='';if(k==='caffeine')name=`${q} mg caffeine`;else if(k==='coffee'||k==='matcha')name=`${q==='.5'?'½':q} tsp ${k==='coffee'?'instant coffee':'matcha'}`;else if(k==='espresso')name=`${q} espresso shot${q==='1'?'':'s'}`;else if(k==='crystal'||k==='morning'){const brand=k==='crystal'?'Crystal Light':'Morning energy';const flavor=val('kick-flavor-'+i).trim();name=`${q==='half'?'½':'1'} ${brand} packet${flavor?' ('+flavor+')':''}`;}else if(cocoa[k]){const measure=cocoaMeasures.find(([v])=>v===q);const factor=Number(q)/3;add(`${measure[1]} ${cocoa[k].label}`,cocoa[k].cal*factor,cocoa[k].n.map(n=>n*factor));continue;}if(name)add(name,0,[0,0,0,0,0]);}
const sw=sweeteners[val('sweetener')];if(sw&&val('sweetener-qty')){const q=Number(val('sweetener-qty')),k=val('sweetener');let qty;if(k==='stevia')qty=`${q} packet${q===1?'':'s'}`;else if(k==='torani')qty=q===1?'1 tsp':q===3?'1 tbsp':'2 tbsp';else qty=q===3?'1 tbsp':`${q} tsp`;const flavor=k==='torani'?val('torani-flavor').trim():'';add(`${qty} ${sw[0]}${flavor?' ('+flavor+')':''}`,k==='torani'?0:sw[1]*q,sw[2].map(x=>k==='torani'?0:x*q));}
extras.forEach((name,i)=>{if(get('extra-'+i).checked)add(name,0,[0,0,0,0,0]);});for(let i=1;i<=2;i++){if(val('custom-name-'+i).trim()&&valid(val('custom-cal-'+i)))add(val('custom-name-'+i).trim(),Number(val('custom-cal-'+i)),[0,0,0,0,0],true);}
const calories=items.reduce((sum,x)=>sum+x.cal,0),macros=[0,1,2,3,4].map(i=>items.reduce((sum,x)=>sum+x.n[i],0)),partial=items.some(x=>x.isManual);
get('calories').textContent=Math.round(calories);get('summary-cal').textContent=Math.round(calories)+' cal';macros.forEach((x,i)=>get('macro-'+i).textContent=format(x)+' g');show('partial-top',partial);show('partial-summary',partial);
get('ingredients').innerHTML=items.length?items.map(x=>`<div class="summary-line"><span>${esc(x.name)}${x.isManual?' <small class="warn">(calories only)</small>':''}</span><span>${x.cal===0?'~0':Math.round(x.cal)} cal</span></div>`).join(''):'<p class="note">No ingredients selected.</p>';
get('summary-macros').innerHTML=['Protein','Fiber','Carbohydrates','Fat','Sugar'].map((n,i)=>`<div class="sum-macro"><span>${n}${partial?' (partial)':''}</span><span>${format(macros[i])} g</span></div>`).join('');
lastCopy='Smoothie\n\n'+(items.length?items.map(x=>`• ${x.name} – ${x.cal===0?'~0':Math.round(x.cal)} cal`).join('\n'):'No ingredients selected')+'\n\nTotal: ~'+Math.round(calories)+' cal\n'+['Protein','Fiber','Carbs','Fat','Sugar'].map((n,i)=>`${n}: ~${format(macros[i])} g${partial?' (partial)':''}`).join('\n')+(partial?'\n\nMacros are incomplete. Manual ingredients count toward calories only.':'')+(val('notes').trim()?'\n\nNotes: '+val('notes').trim():'');
}
root.addEventListener('input',e=>{if(!e.target.matches('input,select,textarea'))return;const id=e.target.id;
if(id==='sl-banana-type')get('banana-qty').value='';if(id==='sl-pb2')get('pb2-qty').value='';if(id==='sl-sweetener')get('sweetener-qty').value='';if(id==='sl-kick-1')get('kick-qty-1').value='';if(id==='sl-kick-2')get('kick-qty-2').value='';if(id==='sl-milk')get('milk-qty').value='';if(id==='sl-shake'){get('shake-qty').value='';get('shake-flavor').value='';}if(id==='sl-powder'){get('powder-qty').value='';get('powder-flavor').value='';}if(id==='sl-yogurt'){get('yogurt-qty').value='';get('yogurt-flavor').value='';}if(id==='sl-avocado-type')get('avocado-qty').value='';if(id==='sl-tofu')get('tofu-grams').value='';if(id==='sl-oat-type')get('oat-qty').value='';if(/^sl-fruit-[123]$/.test(id)){get('fruit-qty-'+id.slice(-1)).value='';get('fruit-grams-'+id.slice(-1)).value='';}calculate();});
root.addEventListener('change',e=>{if(e.target.matches('input,select,textarea'))calculate();});
get('clear').addEventListener('click',()=>{root.querySelectorAll('input,textarea').forEach(x=>{if(x.type==='checkbox')x.checked=false;else x.value='';});root.querySelectorAll('select').forEach(x=>x.value='');get('copy-status').textContent='';calculate();});
get('copy').addEventListener('click',async()=>{try{if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(lastCopy);else{const t=document.createElement('textarea');t.value=lastCopy;t.style.position='fixed';t.style.opacity='0';root.appendChild(t);t.select();const ok=document.execCommand('copy');t.remove();if(!ok)throw Error('Copy not available');}get('copy-status').textContent='Copied! Ready to paste into your food log.';}catch(e){get('copy-status').textContent='Clipboard access is blocked by this browser or site.';}});
calculate();
})();
